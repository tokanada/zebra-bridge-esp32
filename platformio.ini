; zebra-bridge-esp32
; ESP32 BLE -> RS-232 bridge emulating a Zebra ZD421 printer.

[platformio]
default_envs = esp32dev

[env]
monitor_speed = 115200
build_flags =
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=517

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@2.1.0
extra_scripts = pre:scripts/bridge_config.py
board_build.f_cpu = 80000000L

[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = h2zero/NimBLE-Arduino@2.1.0
extra_scripts = pre:scripts/bridge_config.py
board_build.f_cpu = 80000000L

; Host-only environment used by `pio test -e native`.
; It compiles just the Arduino-free console/flow-filter sources.
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<console.cpp> +<flow_filter.cpp>
